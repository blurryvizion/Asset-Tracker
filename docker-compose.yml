services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: asset_tracker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs schema.sql automatically the first time the database starts
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db-data:
